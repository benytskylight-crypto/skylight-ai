<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKYLIGHT AI</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#070e1f;color:#fff;padding-bottom:90px}
.mc{border-radius:14px;display:flex;margin:9px 12px;overflow:hidden;border:1px solid #1e355f;background:#111f3d}
.mi{width:130px;display:flex;align-items:center;justify-content:center;min-height:115px;background:#000;position:relative}
.bd{position:absolute;top:6px;left:6px;padding:3px 8px;border-radius:20px;font-weight:900;font-size:10px}
.in{padding:9px 10px;flex:1;line-height:1.4;font-size:12px}.bs{border:none;padding:7px 12px;border-radius:8px;font-weight:800;cursor:pointer}
.tab{padding:6px 11px;color:#8aa0c6;font-weight:700;font-size:12px;border-radius:20px;background:#111f3d;border:1px solid #1e355f;margin-right:5px;cursor:pointer}
.tab.active{color:#000;background:gold}
</style></head><body>
<div style="display:flex;gap:5px;padding:10px 12px;overflow-x:auto">
<span class="tab active" onclick="filterMach('all',this)">All 36</span>
<span class="tab" onclick="filterMach('vip',this)">VIP 6</span>
<span class="tab" onclick="filterMach('basic',this)">Basic</span>
<span class="tab" onclick="filterMach('pro',this)">Pro</span>
<span class="tab" onclick="filterMach('elite',this)">Elite</span>
</div>
<div id="machList"></div>
<script>
const machines=[
{id:'VIP1',cat:'vip',name:'VIP1 KING',price:1000},{id:'VIP2',cat:'vip',name:'VIP2 EMPEROR',price:2500},{id:'VIP3',cat:'vip',name:'VIP3 LEGEND',price:5000},
{id:'VIP4',cat:'vip',name:'VIP4 TITAN',price:10000},{id:'VIP5',cat:'vip',name:'VIP5 SUPREME',price:20000},{id:'VIP6',cat:'vip',name:'VIP6 ULTIMATE',price:50000},
{id:'BASIC1',cat:'basic',name:'BASIC AI Node 1',price:2000},{id:'BASIC2',cat:'basic',name:'BASIC Node 2',price:5000},{id:'BASIC3',cat:'basic',name:'BASIC Node 3',price:8000},
{id:'BASIC4',cat:'basic',name:'BASIC Node 4',price:10000},{id:'BASIC5',cat:'basic',name:'BASIC Node 5',price:12000},{id:'BASIC6',cat:'basic',name:'BASIC Node 6',price:15000},
{id:'PRO1',cat:'pro',name:'PRO Cluster 1',price:20000},{id:'PRO2',cat:'pro',name:'PRO Cluster 2',price:25000},{id:'PRO3',cat:'pro',name:'PRO Cluster 3',price:30000},
{id:'PRO4',cat:'pro',name:'PRO Cluster 4',price:35000},{id:'PRO5',cat:'pro',name:'PRO Cluster 5',price:40000},{id:'PRO6',cat:'pro',name:'PRO Cluster 6',price:50000},
{id:'PRO7',cat:'pro',name:'PRO Cluster 7',price:60000},{id:'PRO8',cat:'pro',name:'PRO Cluster 8',price:75000},{id:'PRO9',cat:'pro',name:'PRO Cluster 9',price:90000},
{id:'PRO10',cat:'pro',name:'PRO Cluster 10',price:100000},{id:'PRO11',cat:'pro',name:'PRO Cluster 11',price:120000},{id:'PRO12',cat:'pro',name:'PRO Cluster 12',price:150000},
{id:'ELITE1',cat:'elite',name:'ELITE Server 1',price:180000},{id:'ELITE2',cat:'elite',name:'ELITE Server 2',price:200000},{id:'ELITE3',cat:'elite',name:'ELITE Server 3',price:250000},
{id:'ELITE4',cat:'elite',name:'ELITE Server 4',price:300000},{id:'ELITE5',cat:'elite',name:'ELITE Server 5',price:350000},{id:'ELITE6',cat:'elite',name:'ELITE Server 6',price:400000},
{id:'ELITE7',cat:'elite',name:'ELITE Server 7',price:450000},{id:'ELITE8',cat:'elite',name:'ELITE Server 8',price:500000},{id:'ELITE9',cat:'elite',name:'ELITE Server 9',price:600000},
{id:'ELITE10',cat:'elite',name:'ELITE Server 10',price:700000},{id:'ELITE11',cat:'elite',name:'ELITE Server 11',price:800000},{id:'ELITE12',cat:'elite',name:'ELITE Server 12',price:1000000},
];
function render(){let h='';machines.forEach(m=>{
let isVip=m.cat==='vip';
let col=isVip?'gold':(m.cat==='basic'?'#00e5ff':(m.cat==='pro'?'#7b2cff':'#ff6a00'));
h+=`<div class="mc" data-cat="${m.cat}"><div class="mi"><span class="bd" style="background:${col};color:${isVip?'#000':'#fff'}">${m.id} ${isVip?'👑':''}</span><img src="https://i.ibb.co/JjzPSSsV/Sky-machine.jpg" style="width:100px;height:90px;object-fit:cover;border-radius:10px;border:2px solid ${col}"></div><div class="in"><b style="color:${col}">${m.name}</b><br>Price: ${m.price.toLocaleString()} UGX<br>Type: Premium AI Server Rental<br>Duration: 30 Days Unlimited Use<br><span style="color:#2eff8a">✅ Available - No invite needed</span><br><button class="bs" style="background:${col};color:${isVip?'#000':'#fff'}">Buy</button></div></div>`;
});document.getElementById('machList').innerHTML=h;
}
function filterMach(c,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.mc').forEach(card=>{card.style.display=(c==='all'||card.dataset.cat===c)?'flex':'none';});}
render();
</script>
</body></html>
