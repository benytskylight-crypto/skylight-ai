<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKYLIGHT AI COMPANY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070d1f;color:white;font-family:Arial;padding-bottom:90px}
.top{display:flex;justify-content:space-between;padding:14px;background:#0a1430}
.top b{color:#2ecfff}
.top span{color:#3dd68c;font-size:12px}
.tabs{display:flex;justify-content:space-around;padding:10px;background:#0a1430;border-bottom:1px solid #1a2a50;position:sticky;top:0;z-index:10}
.tabs div{color:#8aa0c8;font-size:13px;text-align:center;padding:6px;cursor:pointer}
.tabs .active{color:#2ecfff;border-bottom:2px solid #2ecfff}
.card{display:flex;margin:10px;border-radius:16px;padding:10px;border:1px solid #333}
.card.M{background:#122040;border-color:#1ec8ff}
.card.Y{background:#2a1010;border-color:#ff6a3d}
.card.U{background:#251040;border-color:#b86bff}
.card.A{background:#102a1a;border-color:#3dd68c}
.card.VIP{background:#2a2000;border-color:#ffcc00}
.imgbox{position:relative;width:90px;height:90px;flex-shrink:0}
.imgbox img{width:100%;height:100%;border-radius:12px;background:#000;object-fit:cover;border:2px solid currentColor}
.badge{position:absolute;top:-6px;left:-6px;background:#2ecfff;color:#000;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:bold}
.card.Y .badge{background:#ff6a3d;color:white}
.card.U .badge{background:#b86bff;color:white}
.info{margin-left:12px;flex:1}
.info h4{font-size:14px}
.card.M h4{color:#2ecfff}
.card.Y h4{color:#ff8a65}
.card.U h4{color:#d8a0ff}
.info p{font-size:12px;margin:5px 0;color:#cbd6ee}
.btns{display:flex;gap:8px}
.buy{border:none;padding:6px 14px;border-radius:8px;font-weight:bold;color:white}
.card.M .buy{background:#2ecfff}
.card.Y .buy{background:#ff6a3d}
.card.U .buy{background:#c084ff}
.recv{background:#15b85f;color:white;border:none;padding:6px 14px;border-radius:8px;font-weight:bold}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#0a1430;padding:8px 0;border-top:1px solid #1a2a50}
.nav div{text-align:center;font-size:11px;color:#8aa0c8}
.nav .active{color:#2ecfff}
</style>
</head>
<body>
<div class="top"><b>SKYLIGHT AI COMPANY</b><span>● VIP 17% + INVITE LOCK</span></div>
<div class="tabs">
<div class="active" onclick="filter('ALL',this)">All<br>36</div>
<div onclick="filter('A',this)">A(6)</div>
<div onclick="filter('M',this)">M(6)</div>
<div onclick="filter('U',this)">U/L/Y(18)</div>
<div onclick="filter('VIP',this)">VIP(6) 🔒</div>
</div>
<div id="list"></div>
<div class="nav">
<div class="active">🏠<br>Home</div>
<div>📟<br>Machines</div>
<div onclick="location.href='deposit.html'">💰<br>Wallet</div>
<div>👥<br>Group</div>
<div>📜<br>Rules</div>
<div>⚙️<br>Set</div>
</div>

function render(arr){
 let h="";
 arr.forEach(x=>{
  let icon = x.T=='M'?"❄️":x.T=='Y'?"🔥":x.T=='U'?"🔮":"💎";
  h+=`<div class="card ${x.T}"><div class="imgbox"><div class="badge">${x.M}</div><img src="https://cdn-icons-png.flaticon.com/512/4712/4712009.png"></div><div class="info"><h4>${x.M} SKY 6% ${icon}</h4><p>Price:${x.P.toLocaleString()} Daily:${x.D.toLocaleString()} Total:${x.Tot.toLocaleString()}</p><div class="btns"><button class="buy" onclick="location.href='deposit.html?m=${x.M}&price=${x.P}'">Buy</button><button class="recv">Receive</button></div></div></div>`;
 });
 document.getElementById("list").innerHTML=h;
}
render(data);
function filter(type,el){
 document.querySelectorAll(".tabs div").forEach(d=>d.classList.remove("active"));
 el.classList.add("active");
 if(type=='ALL') render(data);
 else if(type=='U') render(data.filter(x=>x.T=='Y'||x.T=='U'));
 else render(data.filter(x=>x.T==type));
}
</script>

</html>
