<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SKYLIGHT AI</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#070e1f;color:#fff;padding-bottom:80px}.card{background:#111f3d;border-radius:14px;padding:14px;margin:10px;border:1px solid #1e355f}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0e1d38;display:flex;justify-content:space-around;padding:8px 0}.page{display:none}.page.active{display:block}.btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:800}.blue{background:#00aaff;color:#fff}</style></head><body>
<div style="padding:12px"><b style="color:#00e5ff">SKYLIGHT AI COMPANY - 6% / VIP 7% 10Days</b></div>
<div id="p-home" class="page active"><div class="card"><h3>Home - 0 UGX</h3><div id="bal">Balance: 0 UGX | Daily: 0 UGX</div><button class="btn blue" onclick="balance+=daily;document.getElementById('bal').innerText='Balance: '+balance+' UGX | Daily: '+daily+' UGX';alert('Received '+daily+' UGX!')">Receive Daily to Wallet</button></div><div class="card"><button class="btn blue" onclick="showPage('machines')">Go to Machines</button></div></div>
<div id="p-machines" class="page"><div class="card"><b>A1 6% 30D - 2,000 Daily 120</b><br><button class="btn blue" onclick="daily+=120;alert('Bought A1')">Buy A1</button> <button class="btn" style="background:#00cc66;color:#fff" onclick="balance+=120;alert('Received 120')">Receive</button></div><div class="card"><b>M1 6% 30D - 2,000 Daily 120</b><br><button class="btn blue" onclick="daily+=120;alert('Bought M1')">Buy M1</button></div><div class="card"><b>U1 6% 30D - 4,000 Daily 240</b><br><button class="btn blue" onclick="daily+=240;alert('Bought U1')">Buy U1</button></div><div class="card"><b>L1 6% 30D - 3,000 Daily 180</b><br><button class="btn blue" onclick="daily+=180;alert('Bought L1')">Buy L1</button></div><div class="card"><b>Y1 6% 30D - 2,500 Daily 150</b><br><button class="btn blue" onclick="daily+=150;alert('Bought Y1')">Buy Y1</button></div><div class="card"><b>VIP1 7% 10D - 1,000 Daily 70 Total 1,700</b><br><button class="btn blue" style="background:gold;color:#000" onclick="daily+=70;alert('Bought VIP1 10 Days')">Buy VIP1 10D</button></div></div>
<div class="bottom"><div onclick="showPage('home')">Home</div><div onclick="showPage('machines')">Machines</div></div>
<script>let balance=0,daily=0;function showPage(p){document.querySelectorAll('.page').forEach(x=>x.style.display='none');document.getElementById('p-'+p).style.display='block';}</script></body></html>
