<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skylight AI - Admin</title>
<style>
body{margin:0;font-family:Arial;background:#0f0f23;color:white;padding:15px}
.login{max-width:320px;margin:80px auto;background:white;color:black;padding:25px;border-radius:20px;text-align:center}
.login input{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:1px solid #ccc}
.login button{width:100%;padding:14px;background:#6c5ce7;color:white;border:none;border-radius:10px;font-weight:bold}
.card{background:white;color:black;border-radius:12px;padding:12px;margin:10px 0}
</style>
</head>
<body>

<div id="loginPanel" class="login">
<h2>SKYLIGHT AI</h2>
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="err" style="color:red"></p>
</div>

<div id="adminPanel" style="display:none">
<h2 style="text-align:center">DEPOSITS</h2>
<p style="text-align:center"><button onclick="location.reload()" style="padding:10px;background:#6c5ce7;color:white;border:none;border-radius:8px">🔄 Refresh</button>
<button onclick="localStorage.clear();location.reload()" style="padding:10px;background:#333;color:white;border:none;border-radius:8px">Logout</button></p>
<div id="list">Loading...</div>
</div>

<script>
const SHEET_CSV = "https://docs.google.com/spreadsheets/d/1yBmiGJg1BF6qfnas1EUQvXAdzU-nuwCBzORmYdt-vpE/gviz/tq?tqx=out:csv";
function login(){
 if(document.getElementById("pass").value==="SKYLIGHT2026"){
  localStorage.setItem("skylight_admin","yes");
  showAdmin();
 } else {document.getElementById("err").innerText="Wrong password"}
}
function showAdmin(){
 document.getElementById("loginPanel").style.display="none";
 document.getElementById("adminPanel").style.display="block";
 load();
}
if(localStorage.getItem("skylight_admin")==="yes") showAdmin();

function load(){
 fetch(SHEET_CSV).then(r=>r.text()).then(text=>{
  let rows = text.split("\n").slice(1).reverse();
  if(rows.length==0||text.length<20){document.getElementById("list").innerHTML="No deposits yet. Check Google Sheet has data.";return}
  let html="";
  rows.forEach(r=>{
   if(!r.trim())return;
   let cols = r.split(",");
   html+=`<div class="card">${r}</div>`;
  });
  document.getElementById("list").innerHTML=html;
 }).catch(()=>{document.getElementById("list").innerHTML="Failed to load. Make Sheet public: In Google Sheet click Share > Anyone with link > Viewer";});
}
</script>
</body>
</html>
